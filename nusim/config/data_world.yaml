    x0: 0.0
    y0: 0.0
    theta0: 0.0

    wheel_radius: 0.033
    track_width: 0.16

    arena_x_length: 7.0
    arena_y_length: 7.0

    obstacles:
      x: [ 0.5,  -0.7,  1.5, -1.3,  0.3]
