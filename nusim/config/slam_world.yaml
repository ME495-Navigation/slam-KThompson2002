/**:
  ros__parameters:
    x0: 0.0
    y0: 0.0
    theta0: 0.0

    wheel_radius: 0.033
    track_width: 0.16

    arena_x_length: 7.0
    arena_y_length: 7.0

    obstacles:
      x: [ 0.5,  -0.7,  1.5, -1.3,  0.3]
      y: [ 0.7,   1.2, -0.8, -0.9, -1.5]
      r: 0.038

    # Laser scan
    noise: 0.01          # std dev on range measurements [m]

    # Motion noise — causes dead-reckoning to drift from ground truth
    input_noise:   0.01  # std dev added to wheel velocity commands [rad/s]
    slip_fraction: 0.05  # uniform slip factor applied to each wheel each tick

    # Sensor noise — zero-mean Gaussian added to fake sensor obstacle positions
    basic_sensor_variance: 0.0001  # variance [m^2] (std dev ~0.1 m)
